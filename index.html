<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cote Cartes">
<meta name="theme-color" content="#16213e">
<title>Cote Cartes</title>
<style>
:root{--bg:#eef1f7;--card:#fff;--ink:#16213e;--mute:#667089;--line:#dde2ee;--blue:#2b59ff;--green:#16845a;--alert:#c2410c}
@media (prefers-color-scheme:dark){:root{--bg:#0f1526;--card:#18213a;--ink:#eef1f7;--mute:#98a2bd;--line:#2a3555;--blue:#7b9bff;--green:#47c995;--alert:#ff9461}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
header{position:sticky;top:0;background:var(--bg);padding:12px 14px 8px;z-index:5;border-bottom:1px solid var(--line)}
h1{font-size:22px;margin:0 0 10px;letter-spacing:-.3px}
form{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--blue);color:#fff;font-weight:600}
button.alt{background:transparent;color:var(--blue);border:1px solid var(--line)}
nav{display:flex;gap:6px;margin-top:10px}
nav button{flex:1;background:transparent;color:var(--mute);border:1px solid var(--line)}
nav button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{padding:12px 14px 40px;display:grid;gap:12px}
.msg{color:var(--mute);text-align:center;padding:30px 10px}
.c{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
.c img{width:84px;height:117px;object-fit:contain;border-radius:6px;flex:none;background:var(--bg)}
.c .b{flex:1;min-width:0}
.c h2{font-size:16px;margin:0}
.c .s{color:var(--mute);font-size:13px;margin-bottom:6px}
.p{font-size:22px;font-weight:700;color:var(--green)}
.d{font-size:13px;color:var(--mute)}
.r{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.r a,.r button{font-size:13px;padding:7px 10px;border-radius:8px;text-decoration:none;background:transparent;color:var(--blue);border:1px solid var(--line);font-weight:600}
.flag{display:inline-block;background:var(--alert);color:#fff;font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px;margin-left:6px}
</style>
</head>
<body>
<header>
  <h1>Cote Cartes</h1>
  <form id="f">
    <input id="q" placeholder="Nom d’une carte (ex : Dracaufeu)" enterkeyhint="search" autocomplete="off">
    <button>Chercher</button>
  </form>
  <nav>
    <button id="t1" class="on" type="button">Recherche</button>
    <button id="t2" type="button">Suivi</button>
  </nav>
</header>
<main id="out"><div class="msg">Cherche une carte pour voir sa cote Cardmarket.</div></main>

<script>
const API = "https://api.pokemontcg.io/v2/cards";
const out = document.getElementById("out");
let tab = 1;

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const eur = n => n == null ? "—" : n.toLocaleString("fr-FR", {style:"currency", currency:"EUR"});

function load(){ try { return JSON.parse(localStorage.getItem("suivi") || "[]"); } catch(e){ return []; } }
function save(l){ try { localStorage.setItem("suivi", JSON.stringify(l)); } catch(e){} }

function links(c){
  const t = encodeURIComponent(c.name + " " + c.number + " " + c.set);
  return `<a href="https://www.ebay.fr/sch/i.html?_nkw=${t}&LH_BIN=1&_sop=15" target="_blank" rel="noopener">eBay</a>
          <a href="https://www.vinted.fr/catalog?search_text=${t}&order=price_low_to_high" target="_blank" rel="noopener">Vinted</a>`;
}

function slim(c){
  const p = c.cardmarket && c.cardmarket.prices || {};
  return {id:c.id, name:c.name, number:c.number, set:c.set.name, img:c.images.small,
          trend:p.trendPrice ?? null, low:p.lowPrice ?? null, avg30:p.avg30 ?? null,
          date:c.cardmarket ? c.cardmarket.updatedAt : null};
}

function row(c, followed){
  const w = load().find(x => x.id === c.id);
  const hit = w && w.target != null && c.trend != null && c.trend <= w.target;
  return `<div class="c"><img src="${esc(c.img)}" alt="" loading="lazy">
    <div class="b"><h2>${esc(c.name)}${hit ? '<span class="flag">Sous ton seuil</span>' : ""}</h2>
      <div class="s">${esc(c.set)} · n° ${esc(c.number)}</div>
      <div class="p">${eur(c.trend)}</div>
      <div class="d">le moins cher ${eur(c.low)} · moyenne 30 j ${eur(c.avg30)}</div>
      ${w && w.target != null ? `<div class="d">Seuil : ${eur(w.target)}</div>` : ""}
      <div class="r">${links(c)}
        <button data-id="${esc(c.id)}" data-act="${followed ? "set" : "add"}">${followed ? "Changer le seuil" : "Suivre"}</button>
        ${followed ? `<button data-id="${esc(c.id)}" data-act="del">Retirer</button>` : ""}
      </div></div></div>`;
}

let results = [];

async function search(q){
  out.innerHTML = '<div class="msg">Recherche…</div>';
  try {
    const url = `${API}?q=${encodeURIComponent('name:"' + q + '*"')}&pageSize=24&orderBy=-set.releaseDate&select=id,name,number,set,images,cardmarket`;
    const r = await fetch(url);
    if (!r.ok) throw new Error(r.status);
    results = (await r.json()).data.map(slim);
    out.innerHTML = results.length ? results.map(c => row(c, false)).join("") : '<div class="msg">Aucune carte trouvée. Essaie le nom en anglais (ex : Charizard).</div>';
  } catch(e) {
    out.innerHTML = '<div class="msg">Impossible de joindre le service de prix. Vérifie ta connexion et réessaie.</div>';
  }
}

async function showWatch(){
  const list = load();
  if (!list.length){ out.innerHTML = '<div class="msg">Rien en suivi. Appuie sur « Suivre » depuis une recherche.</div>'; return; }
  out.innerHTML = list.map(c => row(c, true)).join("");
  // Rafraîchit les prix en direct
  for (const c of list){
    try {
      const r = await fetch(`${API}/${c.id}?select=id,name,number,set,images,cardmarket`);
      if (!r.ok) continue;
      const fresh = slim((await r.json()).data);
      Object.assign(c, fresh);
    } catch(e){}
  }
  save(list);
  if (tab === 2) out.innerHTML = list.map(c => row(c, true)).join("");
}

out.addEventListener("click", e => {
  const b = e.target.closest("button[data-act]");
  if (!b) return;
  const id = b.dataset.id, act = b.dataset.act;
  let list = load();
  if (act === "del") list = list.filter(x => x.id !== id);
  else {
    const src = list.find(x => x.id === id) || results.find(x => x.id === id);
    const v = prompt("Prévenir quand le prix passe sous (en €) ?", src.target ?? "");
    if (v === null) return;
    const n = parseFloat(v.replace(",", "."));
    src.target = isNaN(n) ? null : n;
    if (act === "add") list.push(src);
  }
  save(list);
  if (tab === 2) showWatch(); else out.innerHTML = results.map(c => row(c, false)).join("");
});

document.getElementById("f").addEventListener("submit", e => {
  e.preventDefault();
  const q = document.getElementById("q").value.trim();
  if (!q) return;
  tab = 1; setTab();
  document.activeElement.blur();
  search(q);
});

function setTab(){
  document.getElementById("t1").classList.toggle("on", tab === 1);
  document.getElementById("t2").classList.toggle("on", tab === 2);
}
document.getElementById("t1").onclick = () => { tab = 1; setTab(); out.innerHTML = results.length ? results.map(c => row(c, false)).join("") : '<div class="msg">Cherche une carte pour voir sa cote Cardmarket.</div>'; };
document.getElementById("t2").onclick = () => { tab = 2; setTab(); showWatch(); };
</script>
</body>
</html>
